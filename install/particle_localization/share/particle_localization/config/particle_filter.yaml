particle_filter:
  ros__parameters:

    use_sim_time: true

    num_particles: 1000
    publish_rate: 10.0

    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    global_initialization: true

    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05

    laser_beams: 18
    laser_sigma: 0.20
    z_hit: 0.90
    z_rand: 0.10
    max_range: 5.6

    resample_threshold: 0.50

    # Gazebo currently starts at x=0, y=-3, yaw=0.
    initial_pose_x: 0.0
    initial_pose_y: -3.0
    initial_pose_yaw: 0.0
